[workspace]
resolver = "2"
members = ["src-tauri", "crates/morpho-engine", "crates/morpho-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["0718lol"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
