name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch conversion engines
        run: python scripts/fetch_engines.py

      - name: Install frontend deps
        run: npm ci

      - name: Run engine unit tests
        run: cargo test -p morpho-engine

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Morpho ${{ github.ref_name }}"
          releaseBody: "🦋 Morpho — local-first universal converter. All engines bundled."
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
